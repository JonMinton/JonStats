project:
  type: website
  resources:
    # CNAME binds the stats.jonminton.net custom domain on GitHub Pages.
    # It must ship with every publish: `quarto publish gh-pages` rewrites
    # the whole branch, and losing this file silently unbinds the domain.
    - CNAME

website:
  title: "JonStats"
  site-url: https://stats.jonminton.net/
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd
      - sidebar:main-course
      - sidebar:extended-glms
      - sidebar:extra-courses
    right:
      - text: "Interactive Dashboard"
        href: https://stats-board.jonminton.net/
        target: _blank

  sidebar:
    - id: main-course
      title: "Main Course: Statistical Inference and Simulation"
      contents:
        - href: pages/main-course/statistics-as-circuits/index.qmd
          text: "(0) Statistics as Circuit Boards"
        - href: pages/main-course/intro-to-glms/index.qmd
          text: "(1) Intro to GLMs"
        - href: pages/main-course/likelihood-and-simulation-theory/index.qmd
          text: "(2) Likelihood and Simulation Theory"
        - href: pages/main-course/complete-simulation-example/index.qmd
          text: "(3) Complete Simulation Example"

    - id: extended-glms
      title: "Extended GLM Families"
      contents:
        - href: pages/main-course/ordinal-regression/index.qmd
          text: "Ordinal Regression"
        - href: pages/main-course/negative-binomial-regression/index.qmd
          text: "Negative Binomial Regression"
        - href: pages/main-course/beta-regression/index.qmd
          text: "Beta Regression"

    - id: extra-courses
      title: "Supplementary Courses"
      contents:
        - href: pages/extra-courses/causal-inference/index.qmd
          text: "Causal Inference"
        - href: pages/extra-courses/time-series/index.qmd
          text: "Time Series"
        - href: pages/extra-courses/survival-analysis/index.qmd
          text: "Survival Analysis"
        - href: pages/extra-courses/hacker-stats/index.qmd
          text: "Hacker Stats"
        - href: pages/extra-courses/p-values-stat-sig/index.qmd
          text: "P-Values and Statistical Significance"




format:
  html:
    theme:
      light: cosmo
      dark: slate
    css: styles.css
    toc: true
    # Render maths with KaTeX instead of Quarto's default MathJax. The MathJax
    # path injects a third-party polyfill <script>; before Quarto 1.5 its host
    # was polyfill.io, which was sold in 2024 and began serving malware (a
    # supply-chain attack). KaTeX needs no polyfill, so this removes that
    # dependency entirely and cannot regress if the site is rebuilt with an
    # older Quarto. See the equivalent fix in the jon-blog repo.
    html-math-method: katex


